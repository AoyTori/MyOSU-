name: Build McOsu (eigener Client)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false   # one variant failing does not stop the others
      matrix:
        include:
          - arch: 64
            cpu: Intel-ArrowLake
            march: arrowlake
            fallback: alderlake
            defines: ""
            msystem: MINGW64
            pkg: x86_64
            mingw: mingw64
            extra: mingw-w64-x86_64-freetype mingw-w64-x86_64-glew mingw-w64-x86_64-libjpeg-turbo
          - arch: 64
            cpu: AMD-Zen4
            march: znver4
            fallback: znver3
            defines: "-DMYOSU_NO_DEFAULT_AFFINITY"
            msystem: MINGW64
            pkg: x86_64
            mingw: mingw64
            extra: mingw-w64-x86_64-freetype mingw-w64-x86_64-glew mingw-w64-x86_64-libjpeg-turbo
          - arch: 64
            cpu: Allgemein
            march: x86-64-v2
            fallback: x86-64
            defines: "-DMYOSU_NO_DEFAULT_AFFINITY"
            msystem: MINGW64
            pkg: x86_64
            mingw: mingw64
            extra: mingw-w64-x86_64-freetype mingw-w64-x86_64-glew mingw-w64-x86_64-libjpeg-turbo
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: mingw-w64-${{ matrix.pkg }}-gcc git unzip ${{ matrix.extra }}

      - name: McEngine + McOsu holen, Patches anwenden
        run: |
          set -e
          git config --global core.autocrlf false
          git clone --depth 1 https://github.com/McKay42/McEngine.git
          git clone --depth 1 https://github.com/McKay42/McOsu.git
          cd McOsu
          if [ -f ../patches/myosu-all.patch ]; then
            PATCHES="../patches/myosu-all.patch"   # one file with everything, the other patch files are ignored
          else
            PATCHES=$(ls ../patches/*.patch)
          fi
          for p in $PATCHES; do
            echo "Patch: $p"
            tr -d '\r' < "$p" > /tmp/fix.patch
            git apply --whitespace=nowarn /tmp/fix.patch || { echo "===== PATCH FEHLGESCHLAGEN: $p ====="; exit 1; }
          done
          cd ..
          # engine changes (DX11: flip model + tearing, max 1 queued frame)
          if [ -f patches/myosu-engine.diff ]; then
            tr -d '\r' < patches/myosu-engine.diff > /tmp/engine.patch
            (cd McEngine && git apply --whitespace=nowarn /tmp/engine.patch) || { echo "===== ENGINE PATCH FEHLGESCHLAGEN ====="; exit 1; }
          fi
          cp -r McOsu/src/App/Osu McEngine/McEngine/src/App/Osu
          E=McEngine/McEngine/src/Engine/Engine.cpp
          sed -i 's|^//#include "Osu.h"|#include "Osu.h"|' "$E"
          sed -i 's|^#include "FrameworkTest.h"|//#include "FrameworkTest.h"|' "$E"
          sed -i 's|//m_app = new Osu();|m_app = new Osu();|' "$E"
          sed -i 's|^\(\s*\)m_app = new FrameworkTest();|\1//m_app = new FrameworkTest();|' "$E"
          # DirectX 11 renderer (like the official McOsu); start with -opengl to get the old renderer back
          F=McEngine/McEngine/src/Engine/Main/EngineFeatures.h
          sed -i 's|^//#define MCENGINE_FEATURE_DIRECTX11|#define MCENGINE_FEATURE_DIRECTX11|' "$F"
          grep -q '^#define MCENGINE_FEATURE_DIRECTX11' "$F"
          W=McEngine/McEngine/src/Engine/Platform/WinEnvironment.cpp
          sed -i 's|^\treturn new WinGLLegacyInterface(m_hwnd);|\tif (engine->getArgs().find("-opengl") == -1) return new DirectX11Interface(m_hwnd);\n\treturn new WinGLLegacyInterface(m_hwnd);|' "$W"
          grep -q 'find("-opengl")' "$W"
          # own shader folder, so the (newer) shaders of the official McOsu in the same folder are not used
          R=McEngine/McEngine/src/Engine/ResourceManager.cpp
          sed -i 's|PATH_DEFAULT_SHADERS = "shaders/";|PATH_DEFAULT_SHADERS = "myosu_shaders/";|' "$R"
          grep -q '"myosu_shaders/"' "$R"
          mkdir -p myosu_shaders
          cp McOsu/build/shaders/* myosu_shaders/
          cd McEngine/McEngine/src/App
          rm -rf FrameworkTest Asteroids Tetris GUICoherenceMode UIFrameworkTest
          cd ../../../..
          # 64-bit: the engine only ships 32-bit libraries, so get BASS x64 from un4seen
          if [ "${{ matrix.arch }}" = "64" ]; then
            mkdir -p bass64
            curl -fsSL -o bass.zip https://www.un4seen.com/files/bass24.zip
            curl -fsSL -o bassfx.zip https://www.un4seen.com/files/z/0/bass_fx24.zip
            unzip -o -q bass.zip -d bass_zip
            unzip -o -q bassfx.zip -d bassfx_zip
            cp "$(find bass_zip -ipath '*x64*' -iname bass.dll | head -1)" bass64/bass.dll
            cp "$(find bassfx_zip -ipath '*x64*' -iname bass_fx.dll | head -1)" bass64/bass_fx.dll
            ls -la bass64
          fi

      - name: Kompilieren
        run: |
          set -e
          cd McEngine/McEngine
          mkdir -p out
          INC=""
          while IFS= read -r d; do INC="$INC -I$d"; done < <(find src -type d)
          if [ "${{ matrix.arch }}" = "64" ]; then
            # use the MSYS2 freetype/libjpeg headers (they must match the 64-bit libraries)
            for d in libraries/*/include; do case "$d" in *freetype*|*libjpeg*) ;; *) INC="$INC -I$d";; esac; done
            INC="$INC -I/mingw64/include/freetype2 -I/mingw64/include/freetype2/freetype"
          else
            for d in libraries/*/include; do INC="$INC -I$d"; done
          fi
          export INC
          # CPU target of this variant (fallback if the GCC is too old for it)
          ARCH=${{ matrix.march }}
          if ! echo | gcc -march=$ARCH -E -x c - >/dev/null 2>&1; then ARCH=${{ matrix.fallback }}; fi
          TUNE=$ARCH
          case "$ARCH" in x86-64*) TUNE=generic;; esac
          echo "CPU target: $ARCH (tune $TUNE)"
          export OPT="-O3 -march=$ARCH -mtune=$TUNE -fomit-frame-pointer -fno-math-errno ${{ matrix.defines }}"
          export FLAGS="-std=c++11 $OPT -c -fmessage-length=0 -w -fpermissive -D__GXX_EXPERIMENTAL_CXX0X__ -D__gl_glext_h_ -D__wgl_wglext_h_ -DWIN32STDMUTEX_H -DQWORD=ULONGLONG"
          : > out/fehler.txt
          find src -name '*.cpp' | xargs -P 4 -I{} sh -c 'o="out/$(echo "{}" | tr "/." "__").o"; g++ $FLAGS $INC -o "$o" "{}" 2> "$o.log" || { echo "{}" >> out/fehler.txt; cat "$o.log"; }'
          find src -name '*.c' | xargs -r -P 4 -I{} sh -c 'o="out/$(echo "{}" | tr "/." "__").o"; gcc $OPT -c -w $INC -o "$o" "{}" 2> "$o.log" || { echo "{}" >> out/fehler.txt; cat "$o.log"; }'
          if [ -s out/fehler.txt ]; then echo "===== FEHLER IN DIESEN DATEIEN ====="; cat out/fehler.txt; exit 1; fi
          if [ "${{ matrix.arch }}" = "64" ]; then
            cp ../../bass64/*.dll out/
            g++ -s -w $OPT -mwindows -static-libgcc -static-libstdc++ -o out/MyOsu.exe out/*.o out/bass.dll out/bass_fx.dll \
              -lfreetype -lglew32 -ljpeg -ld3dcompiler_47 -ld3d11 -ldxgi -lopengl32 -lglu32 -lgdi32 \
              -lcomctl32 -ldwmapi -lcomdlg32 -lpsapi -lws2_32 -lwinhttp -lwinmm -Wl,-Bstatic -lpthread -Wl,-Bdynamic -latomic
          else
            LIBDIRS=""
            for d in libraries/*/lib/windows; do LIBDIRS="$LIBDIRS -L$d"; done
            g++ -s -mwindows -static-libgcc -static-libstdc++ -o out/MyOsu.exe out/*.o $LIBDIRS \
              -logg -lADLMIDI -lmad -lmodplug -lsmpeg -lgme -lvorbis -lopus -lvorbisfile -ldiscord-rpc -lsteam_api \
              -lSDL2_mixer_ext.dll -lSDL2 -ld3dcompiler_47 -ld3d11 -ldxgi -lopenvr_api -llibcurl -llibxinput9_1_0 \
              -llibBulletSoftBody -llibBulletDynamics -llibBulletCollision -llibLinearMath -lfreetype -lopengl32 \
              -lOpenCL -lvulkan-1 -lglew32 -lglu32 -lgdi32 -lbass -lbass_fx -lcomctl32 -lDwmapi -lComdlg32 -lpsapi \
              -lenet -lws2_32 -lwinhttp -lwinmm -Wl,-Bstatic -lpthread -Wl,-Bdynamic -llibjpeg -llibatomic
          fi
          mkdir -p dist
          cp out/MyOsu.exe dist/
          if [ "${{ matrix.arch }}" = "64" ]; then
            cp out/bass.dll out/bass_fx.dll dist/
            # every MSYS2 DLL the exe needs (freetype + its dependencies, glew, libjpeg, ...)
            ldd out/MyOsu.exe | awk '/\/mingw64\//{print $3}' | sort -u | xargs -r -I{} cp "{}" dist/ || true
          else
            cp build/*.dll dist/
          fi
          mkdir -p dist/myosu_shaders
          cp ../../myosu_shaders/* dist/myosu_shaders/
          for dll in libwinpthread-1.dll libatomic-1.dll libgcc_s_dw2-1.dll libgcc_s_seh-1.dll libstdc++-6.dll; do
            if [ -f "/${{ matrix.mingw }}/bin/$dll" ]; then cp "/${{ matrix.mingw }}/bin/$dll" dist/; fi
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MyOsu-${{ matrix.cpu }}
          path: McEngine/McEngine/dist/
          if-no-files-found: error
